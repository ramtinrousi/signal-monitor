name: Build Flet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.3
          channel: stable
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Flet
        run: pip install flet[all]
      - name: Debug Info
        run: |
          echo "=== Files ==="
          ls -la
          echo "=== pyproject.toml ==="
          cat pyproject.toml
          echo "=== flet version ==="
          flet --version
      - name: Build APK
        run: flet build apk --arch arm64-v8a
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-monitor-apk
          path: build/apk/*.apk
          if-no-files-found: warn
