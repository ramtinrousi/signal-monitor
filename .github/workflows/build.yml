name: Build Flet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test - Show files
        run: |
          pwd
          ls -la

      - name: Test - Show python
        run: python --version || echo "no python"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.3
          channel: stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet[all]

      - name: Check Flet
        run: |
          which flet
          flet --version

      - name: Build APK
        run: flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-monitor-apk
          path: build/apk/*.apk
          if-no-files-found: warn
