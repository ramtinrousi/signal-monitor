name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files
        run: ls -la

      - name: Show pyproject.toml
        run: cat pyproject.toml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flet
        run: pip install flet[all]

      - name: Build APK
        run: |
          set +e
          echo "y" | flet build apk --arch arm64-v8a --android-extract-packages pandas numpy matplotlib scipy > build_output.txt 2>&1
          EXIT_CODE=$?
          echo "================================"
          echo "BUILD EXIT CODE: $EXIT_CODE"
          echo "================================"
          cat build_output.txt
          exit 0

      - name: Upload build output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: build_output.txt
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-monitor-apk
          path: build/apk/*.apk
          if-no-files-found: warn
