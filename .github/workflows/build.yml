name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files
        run: ls -la

      - name: Show pyproject
        run: cat pyproject.toml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.3
          channel: stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flet
        run: pip install flet[all]

      - name: Check Flet version
        run: flet --version

      - name: Run Flet build and capture output
        run: |
          set +e
          flet build apk > build_output.txt 2>&1
          EXIT_CODE=$?
          echo "================================"
          echo "BUILD EXIT CODE: $EXIT_CODE"
          echo "================================"
          echo "OUTPUT:"
          echo "================================"
          cat build_output.txt
          echo "================================"
          echo "END OF OUTPUT"
          echo "================================"
          exit 0

      - name: Upload build output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: build_output.txt
          if-no-files-found: warn
